<title>永田町への道 天下取り</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
  /* Layout: strategy board. HUD on top, Japan tile map + power balance on the left, prefecture dossier + commands on the right; stacks on phones. Single dark "国会の夜" look. */
  :root {
    --bg: #0f131b;
    --panel: #181f2c;
    --panel2: #212a3a;
    --line: #313c51;
    --ink: #ece6d6;
    --muted: #9ba5b7;
    --gold: #d4b04c;
    --gold-ink: #1a1508;
    --danger: #ef7d6d;
    --good: #7cc79a;
    --shady: #c45a7c;
    --you: #e0679c;
    --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-num: "BIZ UDGothic", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 30% -10%, #1b2436 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px;
  }
  #app { max-width: 1280px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.35; text-wrap: balance; }
  h2 { font-size: 20px; }
  h3 { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
  h3 small, h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; letter-spacing: 0; }
  p { margin: 0; }
  button, a.ghost, a.primary { font: inherit; color: inherit; cursor: pointer; text-decoration: none; }
  button:focus-visible, a:focus-visible, .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[disabled] { cursor: default; opacity: .4; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--gold); }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .primary { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 6px; padding: 11px 24px; font-weight: 700; letter-spacing: .06em; display: inline-block; }
  .primary:hover:not([disabled]) { filter: brightness(1.1); }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 9px 16px; display: inline-block; }
  .ghost:hover:not([disabled]) { border-color: var(--gold); }
  .ghost.shady { border-color: color-mix(in srgb, var(--shady) 60%, var(--line)); }
  em { font-style: normal; font-size: 10px; font-weight: 700; color: var(--bg); background: var(--shady); border-radius: 3px; padding: 0 5px; margin-left: 6px; letter-spacing: .1em; vertical-align: 1px; }
  .portrait { display: block; flex: none; border-radius: 8px; }

  /* setup */
  .setup { display: grid; gap: 28px; padding-top: 28px; }
  .title { display: grid; gap: 12px; }
  .title h1 { font-size: clamp(44px, 11vw, 88px); font-weight: 900; letter-spacing: .12em; background: linear-gradient(180deg, #f3dc8c, var(--gold) 55%, #8a6a22); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1; }
  .title p { max-width: 36em; color: var(--muted); }
  .setup-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .setup-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); } }
  .setup-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .who { display: flex; gap: 16px; align-items: center; }
  .who-fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; min-width: 0; }
  .who-fields .segs { grid-column: 1 / -1; }
  .who-fields label { font-size: 13px; color: var(--muted); }
  input { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 100%; min-width: 0; }
  .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .type { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; align-content: start; }
  .type b { font-family: var(--font-display); font-size: 17px; }
  .type small { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .type span { font-family: var(--font-num); font-size: 11px; color: var(--gold); }
  .type.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }

  .segs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg { background: none; border: 0; padding: 5px 14px; font-size: 13px; color: var(--muted); }
  .seg.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }

  /* HUD */
  .hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-block: 10px; display: grid; gap: 8px; margin-bottom: 18px; }
  .hud-row { display: flex; align-items: center; gap: 14px; }
  .hud-date { display: grid; line-height: 1.3; min-width: 0; }
  .hud-date b { font-family: var(--font-display); font-size: 20px; }
  .hud-date span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-ap { display: flex; gap: 5px; align-items: center; margin-left: auto; }
  .hud-ap small { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .ap { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--gold); }
  .ap.on { background: var(--gold); box-shadow: 0 0 8px color-mix(in srgb, var(--gold) 60%, transparent); }
  .end { background: var(--you); color: #1a0c13; border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 700; white-space: nowrap; }
  .hud-stats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  .hud-stats div { display: grid; min-width: 0; }
  .hud-stats span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-stats b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-stats b.small { font-family: var(--font-body); font-size: 13px; }
  .hud-stats small { font-size: 10px; color: var(--muted); margin-left: 1px; }
  .neg { color: var(--danger); }
  @media (max-width: 760px) { .hud-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; } .hud-stats b { font-size: 14px; } }

  /* board */
  .board { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .board { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } .col-side { position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow-y: auto; padding-right: 4px; } }
  .col-map, .col-side { display: grid; gap: 18px; min-width: 0; align-content: start; }
  .map-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .map-box { background: linear-gradient(180deg, #13233a, #0f1a2b); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .map { width: 100%; height: auto; display: block; }
  .tile { cursor: pointer; }
  .tile-edge { stroke: rgba(255,255,255,.12); stroke-width: 1; }
  .tile:hover .tile-edge { stroke: rgba(255,255,255,.5); }
  .tile.sel .tile-edge { stroke: var(--gold); stroke-width: 2.5; }
  .tile-label { fill: #fff; font-family: var(--font-display); font-weight: 700; paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 2.5px; pointer-events: none; }
  .map-note { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }

  .power { display: grid; gap: 8px; }
  .power-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .power-head span { font-size: 13px; color: var(--muted); }
  .power-head b { color: var(--ink); font-family: var(--font-num); }
  .power-bar { position: relative; display: flex; height: 18px; border-radius: 4px; overflow: hidden; }
  .power-bar span { display: block; }
  .power-bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; padding: 0; margin: 0; background: var(--ink); border-radius: 0; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
  .legend li { display: flex; align-items: center; gap: 5px; }
  .legend i, .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend b { font-family: var(--font-num); }

  .log ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
  .log li { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px; color: var(--muted); }
  .log li time { font-family: var(--font-num); font-size: 11.5px; padding-top: 2px; }
  .log li.mine { color: var(--ink); }
  .log li.big { color: var(--gold); }
  .log li.shady { color: var(--shady); }

  /* prefecture dossier */
  .pref { scroll-margin-top: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
  .pref-head { display: flex; justify-content: space-between; align-items: start; }
  .pref-head h2 { font-size: 28px; }
  .chip { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); }
  .chip.gold { color: var(--gold); border-color: var(--gold); }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }
  .facts div { background: var(--panel2); border-radius: 6px; padding: 6px 10px; min-width: 0; }
  .facts dt { font-size: 11px; color: var(--muted); }
  .facts dd { margin: 0; font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; }
  .facts dd.small { font-size: 13px; }
  .facts small { font-size: 10px; color: var(--muted); margin-left: 2px; }
  .sups { display: grid; gap: 4px; }
  .sup { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 3em; gap: 8px; align-items: center; font-size: 13px; }
  .sup b { font-family: var(--font-num); text-align: right; font-size: 13px; }
  .sup-bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .sup-bar i { display: block; height: 100%; }
  .governor { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .governor > div { display: grid; line-height: 1.4; min-width: 0; }
  .governor small { font-size: 11.5px; color: var(--muted); }
  .governor b { font-size: 14px; }
  .assets { margin-left: auto; text-align: right; }
  .comps { font-size: 13px; }
  .comps small { color: var(--muted); margin-right: 6px; }
  .comps span { color: var(--muted); font-size: 12px; }
  .works { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .works li { display: flex; justify-content: space-between; gap: 10px; border-left: 3px solid var(--gold); padding-left: 8px; }
  .works li.h { border: 0; padding: 0; color: var(--muted); font-size: 12px; }
  .works span { color: var(--muted); }
  .cands { font-size: 13px; color: var(--you); }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
  .person { display: flex; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid transparent; border-radius: 8px; padding: 6px; min-width: 0; }
  .person:hover { border-color: var(--line); }
  .person.you { border-color: var(--you); }
  .person-text { display: grid; line-height: 1.35; min-width: 0; }
  .person-text b { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person-text small { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
  .person-text i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* commands */
  .cmds { display: grid; gap: 14px; }
  .cmd-group { display: grid; gap: 8px; }
  .cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cmd { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
  .cmd:hover:not([disabled]) { border-color: var(--gold); background: var(--panel2); }
  .cmd b { font-size: 14.5px; }
  .cmd small { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .cmd span { font-family: var(--font-num); font-size: 11px; color: var(--gold); }
  .cmd.shady { border-color: color-mix(in srgb, var(--shady) 45%, var(--line)); }

  /* modal */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 12, .72); display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .modal-card { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px; outline: none; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal-card > .primary, .modal-card > .ghost { justify-self: start; }
  .speaker { display: flex; gap: 12px; align-items: flex-start; }
  .speaker > div { display: grid; gap: 2px; min-width: 0; }
  .speaker b { font-family: var(--font-display); }
  .speaker small { font-size: 11.5px; color: var(--muted); }
  .speaker p { background: var(--panel2); border-radius: 0 10px 10px 10px; padding: 10px 14px; margin-top: 4px; }
  .omote, .ura { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
  .omote { border: 1px solid var(--line); }
  .ura { background: #0b0e14; }
  .omote span, .ura span { font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--muted); }
  .ura span { color: var(--gold); }
  .law { font-size: 12px; color: var(--muted); }
  .law b { color: var(--ink); margin-right: 6px; }
  .works-list, .fac-list { display: grid; gap: 8px; }
  .work { background: var(--panel2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
  .work small { display: block; color: var(--muted); font-size: 12px; }
  .work.off { opacity: .5; }
  .work .ghost { padding: 6px 12px; font-size: 13px; }
  .fac-row { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid transparent; border-radius: 8px; padding: 8px; }
  .fac-row:hover:not([disabled]) { border-color: var(--gold); }
  .fac-row span { display: grid; min-width: 0; }
  .fac-row small { color: var(--muted); font-size: 12px; }
  .char-card { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .char-card > div { display: grid; gap: 6px; flex: 1 1 220px; min-width: 0; }
  .char-card .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .report { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .choices { display: grid; gap: 8px; }
  .choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; }
  .choice:hover { border-color: var(--gold); }
  .table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 400; }
  td.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  td .dot { margin-right: 6px; }
  .up { color: var(--good); } .down { color: var(--danger); }
  .cand-list { display: grid; gap: 6px; }
  .cand { display: flex; gap: 10px; align-items: center; background: var(--panel2); border-radius: 8px; padding: 6px 10px; border: 1px solid transparent; }
  .cand > span { display: grid; min-width: 0; }
  .cand small { font-size: 11.5px; color: var(--muted); }
  .cand .votes { margin-left: auto; text-align: right; }
  .cand .votes b { font-family: var(--font-num); font-size: 20px; }
  .cand.win { border-color: var(--gold); }
  .tenka { display: grid; justify-items: center; text-align: center; gap: 8px; }
  .tenka h2 { font-size: clamp(24px, 6vw, 32px); color: var(--gold); }

  @media (max-width: 520px) {
    .types { grid-template-columns: minmax(0, 1fr); }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .assets { margin-left: 0; text-align: left; }
    .cmd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .people { grid-template-columns: minmax(0, 1fr); }
    .end { padding: 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app"></div>

<script src="senryaku-data.js"></script>
<script src="senryaku.js"></script>
